# Sitio de Kuentu para Nginx. Copiar a /etc/nginx/sites-available/kuentu,
# cambiar TU-DOMINIO y el puerto si no es 3100, y luego activar con certbot (HTTPS).
server {
    listen 80;
    server_name TU-DOMINIO;

    root /opt/kuentu/dist;
    index index.html;

    # Los tableros pueden traer fotos propias.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La app y el service worker siempre frescos, para que las actualizaciones lleguen.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Archivos con hash en el nombre: se pueden guardar mucho tiempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /pictos/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
